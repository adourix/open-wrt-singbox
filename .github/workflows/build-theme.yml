name: Build Cowboy Bebop LuCI Theme

on:
  workflow_dispatch:
    inputs:
      target:
        description: "OpenWrt SDK target"
        required: true
        default: "both"
        type: choice
        options: [kt708, x86_64, both]

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  X86_SDK_FILE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  KT708_TARGET: "ipq40xx/generic"
  KT708_ARCH: "arm_cortex-a7_neon-vfpv4"
  KT708_SDK_FILE: openwrt-sdk-25.12.5-ipq40xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
  KT708_SDK_SHA256: af3d15643f8459335b1c98dc97dd47897d2d8e825a990a161b16b43de2281515

jobs:
  test-theme:
    name: Validate theme
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run theme contract tests
        run: sh openwrt/luci-theme-cowboy-bebop/tests/test-theme.sh

  build:
    name: Build ${{ matrix.name }}
    needs: test-theme
    if: inputs.target == 'both' || inputs.target == matrix.target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            name: x86_64
            sdk_file: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_url_target: x86/64
            sdk_sha: ""
            arch: x86_64
          - target: kt708
            name: KT-708 (ipq40xx/generic)
            sdk_file: openwrt-sdk-25.12.5-ipq40xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
            sdk_url_target: ipq40xx/generic
            sdk_sha: af3d15643f8459335b1c98dc97dd47897d2d8e825a990a161b16b43de2281515
            arch: arm_cortex-a7_neon-vfpv4

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install OpenWrt host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd

      - name: Cache OpenWrt SDK archive
        uses: actions/cache@v4
        with:
          path: ${{ matrix.sdk_file }}
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}-${{ matrix.sdk_file }}

      - name: Download and verify SDK
        shell: bash
        env:
          SDK_FILE: ${{ matrix.sdk_file }}
          SDK_TARGET: ${{ matrix.sdk_url_target }}
          EXPECTED_SHA: ${{ matrix.sdk_sha }}
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${SDK_TARGET}"
          wget -q "$base/sha256sums" -O sha256sums
          sha="$(awk -v f="$SDK_FILE" '$2 == "*" f || $2 == f {print $1; exit}' sha256sums)"
          test -n "$sha"
          if [ -n "$EXPECTED_SHA" ] && [ "$sha" != "$EXPECTED_SHA" ]; then
            echo "Pinned SDK checksum mismatch" >&2
            exit 1
          fi
          if [ -f "$SDK_FILE" ]; then
            printf '%s  %s\n' "$sha" "$SDK_FILE" | sha256sum -c - || rm -f "$SDK_FILE"
          fi
          [ -f "$SDK_FILE" ] || wget -q "$base/$SDK_FILE" -O "$SDK_FILE"
          printf '%s  %s\n' "$sha" "$SDK_FILE" | sha256sum -c -
          tar --zstd -xf "$SDK_FILE"
          echo "SDK_DIR=$PWD/${SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"

      - name: Prepare LuCI feed and theme package
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          ./scripts/feeds update luci
          ./scripts/feeds install -a
          rm -rf package/luci-theme-cowboy-bebop
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-theme-cowboy-bebop" package/luci-theme-cowboy-bebop

      - name: Verify target and package metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make defconfig
          grep -q '^PKG_NAME:=luci-theme-cowboy-bebop$' package/luci-theme-cowboy-bebop/Makefile
          grep -q '^PKG_RELEASE:=11$' package/luci-theme-cowboy-bebop/Makefile
          ! grep -q '^  DEPENDS:=' package/luci-theme-cowboy-bebop/Makefile
          grep -q '^CONFIG_TARGET_ARCH_PACKAGES="${{ matrix.arch }}"$' .config
          if [ "${{ matrix.target }}" = "kt708" ]; then
            grep -q '^CONFIG_TARGET_ipq40xx=y$' .config
          else
            grep -q '^CONFIG_TARGET_x86=y$' .config
            grep -q '^CONFIG_TARGET_x86_64=y$' .config
          fi

      - name: Build theme package
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          log="$GITHUB_WORKSPACE/build-theme-${{ matrix.target }}.log"
          make package/luci-theme-cowboy-bebop/compile V=s 2>&1 | tee "$log"

      - name: Collect package and checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "$SDK_DIR/bin/packages" -type f -name 'luci-theme-cowboy-bebop-*.apk' -exec cp {} artifacts/ \;
          test -f "$(find artifacts -name 'luci-theme-cowboy-bebop-*.apk' -print -quit)"
          (cd artifacts && sha256sum *.apk > SHA256SUMS)

      - name: Upload theme package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-cowboy-bebop-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-build-log-${{ matrix.target }}
          path: build-theme-${{ matrix.target }}.log
          if-no-files-found: ignore
          retention-days: 7
