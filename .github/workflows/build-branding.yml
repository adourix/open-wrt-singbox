name: Build Cowboy Bebop Branding Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: "OpenWrt SDK target"
        required: true
        default: "both"
        type: choice
        options: [kt708, x86_64, both]

permissions:
  contents: read

env:
  OPENWRT_VERSION: "25.12.5"
  X86_SDK_FILE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  KT708_TARGET: "ipq40xx/generic"
  KT708_ARCH: "arm_cortex-a7_neon-vfpv4"
  KT708_SDK_FILE: openwrt-sdk-25.12.5-ipq40xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
  KT708_SDK_SHA256: af3d15643f8459335b1c98dc97dd47897d2d8e825a990a161b16b43de2281515

jobs:
  build-x86_64:
    if: inputs.target == 'x86_64' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd
      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.X86_SDK_FILE }}
          key: sdk-${{ env.X86_SDK_FILE }}
      - name: Download and verify SDK
        run: |
          set -eu
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          wget -q "$BASE/sha256sums"
          SHA="$(awk -v f="$X86_SDK_FILE" '$2 == "*" f || $2 == f {print $1; exit}' sha256sums)"
          test -n "$SHA"
          if [ -f "$X86_SDK_FILE" ]; then printf '%s  %s\n' "$SHA" "$X86_SDK_FILE" | sha256sum -c - || rm -f "$X86_SDK_FILE"; fi
          [ -f "$X86_SDK_FILE" ] || wget -q "$BASE/$X86_SDK_FILE" -O "$X86_SDK_FILE"
          printf '%s  %s\n' "$SHA" "$X86_SDK_FILE" | sha256sum -c -
          tar --zstd -xf "$X86_SDK_FILE"
          echo "SDK_DIR=$PWD/${X86_SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"
      - name: Prepare feeds and packages
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update packages
          test -f feeds/packages/net/sing-box/Makefile
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-manager" package/cowboy-bebop-manager
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-branding" package/cowboy-bebop-branding
          cp "$GITHUB_WORKSPACE/core/service/manager.sh" package/cowboy-bebop-manager/files/usr/lib/singbox-manager/service/manager.sh
      - name: Verify package metadata
        run: |
          set -eu
          cd "$SDK_DIR"
          make defconfig
          grep -q '^PKG_NAME:=cowboy-bebop-branding$' package/cowboy-bebop-branding/Makefile
          grep -q '^DEPENDS:=+cowboy-bebop-manager$' package/cowboy-bebop-branding/Makefile
          test -x package/cowboy-bebop-branding/files/etc/profile.d/cowboy-bebop.sh
          test -x package/cowboy-bebop-branding/files/etc/uci-defaults/90-cowboy-bebop-branding
      - name: Build package
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -eu
          cd "$SDK_DIR"
          LOG="$GITHUB_WORKSPACE/build-branding-x86_64.log"
          make package/cowboy-bebop-branding/compile V=s > "$LOG" 2>&1 || { tail -n 120 "$LOG"; exit 1; }
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: branding-build-log-x86_64
          path: build-branding-x86_64.log
      - name: Collect package
        run: |
          set -eu
          mkdir -p artifacts
          find "$SDK_DIR/bin/packages" -type f -name 'cowboy-bebop-branding-*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name 'cowboy-bebop-branding-*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cowboy-bebop-branding-${{ env.OPENWRT_VERSION }}-x86-64
          path: artifacts/*.apk

  build-kt708:
    if: inputs.target == 'kt708' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd
      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.KT708_SDK_FILE }}
          key: sdk-${{ env.KT708_SDK_FILE }}
      - name: Download and verify SDK
        run: |
          set -eu
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${KT708_TARGET}"
          wget -q "$BASE/sha256sums"
          SHA="$(awk -v f="$KT708_SDK_FILE" '$2 == "*" f || $2 == f {print $1; exit}' sha256sums)"
          test "$SHA" = "$KT708_SDK_SHA256"
          if [ -f "$KT708_SDK_FILE" ]; then printf '%s  %s\n' "$SHA" "$KT708_SDK_FILE" | sha256sum -c - || rm -f "$KT708_SDK_FILE"; fi
          [ -f "$KT708_SDK_FILE" ] || wget -q "$BASE/$KT708_SDK_FILE" -O "$KT708_SDK_FILE"
          printf '%s  %s\n' "$SHA" "$KT708_SDK_FILE" | sha256sum -c -
          tar --zstd -xf "$KT708_SDK_FILE"
          echo "SDK_DIR=$PWD/${KT708_SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"
      - name: Verify SDK and prepare packages
        run: |
          set -eu
          cd "$SDK_DIR"
          make defconfig
          grep -q '^CONFIG_TARGET_ipq40xx=y$' .config
          grep -q "^CONFIG_TARGET_ARCH_PACKAGES=\"${KT708_ARCH}\"$" .config
          ./scripts/feeds update packages
          test -f feeds/packages/net/sing-box/Makefile
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-manager" package/cowboy-bebop-manager
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-branding" package/cowboy-bebop-branding
          cp "$GITHUB_WORKSPACE/core/service/manager.sh" package/cowboy-bebop-manager/files/usr/lib/singbox-manager/service/manager.sh
      - name: Verify package metadata
        run: |
          set -eu
          cd "$SDK_DIR"
          make defconfig
          grep -q '^PKG_NAME:=cowboy-bebop-branding$' package/cowboy-bebop-branding/Makefile
          grep -q '^DEPENDS:=+cowboy-bebop-manager$' package/cowboy-bebop-branding/Makefile
          test -x package/cowboy-bebop-branding/files/etc/profile.d/cowboy-bebop.sh
          test -x package/cowboy-bebop-branding/files/etc/uci-defaults/90-cowboy-bebop-branding
      - name: Build package
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -eu
          cd "$SDK_DIR"
          LOG="$GITHUB_WORKSPACE/build-branding-kt708.log"
          make package/cowboy-bebop-branding/compile V=s > "$LOG" 2>&1 || { tail -n 120 "$LOG"; exit 1; }
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: branding-build-log-kt708
          path: build-branding-kt708.log
      - name: Collect package
        run: |
          set -eu
          mkdir -p artifacts-kt708
          find "$SDK_DIR/bin/packages" -type f -name 'cowboy-bebop-branding-*.apk' -exec cp {} artifacts-kt708/ \;
          test -n "$(find artifacts-kt708 -type f -name 'cowboy-bebop-branding-*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: cowboy-bebop-branding-${{ env.OPENWRT_VERSION }}-ipq40xx-generic-${{ env.KT708_ARCH }}
          path: artifacts-kt708/*.apk
