name: Build Cowboy Bebop LuCI Package
on:
  push:
    branches: [main, phase-c-native-luci-ui]
    paths: ["openwrt/luci-app-cowboy-bebop/**", "openwrt/luci-theme-cowboy-bebop/**", ".github/workflows/build-luci.yml", ".github/workflows/build-theme.yml"]
  pull_request:
    paths: ["openwrt/luci-app-cowboy-bebop/**", "openwrt/luci-theme-cowboy-bebop/**", ".github/workflows/build-luci.yml", ".github/workflows/build-theme.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "OpenWrt SDK target"
        required: true
        default: "both"
        type: choice
        options: [kt708, x86_64, both]
permissions:
  contents: read
env:
  OPENWRT_VERSION: "25.12.5"
  X86_SDK_FILE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  KT708_TARGET: "ipq40xx/generic"
  KT708_ARCH: "arm_cortex-a7_neon-vfpv4"
  KT708_SDK_FILE: openwrt-sdk-25.12.5-ipq40xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
  KT708_SDK_SHA256: af3d15643f8459335b1c98dc97dd47897d2d8e825a990a161b16b43de2281515
jobs:
  test-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install syntax tools
        run: sudo apt-get update && sudo apt-get install -y nodejs
      - name: Validate UI and RPC syntax
        run: |
          set -eu
          for f in openwrt/luci-app-cowboy-bebop/htdocs/luci-static/resources/view/cowboy-bebop/*.js; do node --check "$f"; done
          sh -n openwrt/luci-app-cowboy-bebop/root/usr/libexec/rpcd/luci.cowboy_bebop
          sh openwrt/luci-theme-cowboy-bebop/tests/test-theme.sh
  build-x86_64:
    needs: test-ui
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd
      - name: Download and verify SDK
        run: |
          set -eu
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          wget -q "$BASE/sha256sums"
          SHA="$(awk -v f="$X86_SDK_FILE" '$2 == "*" f || $2 == f {print $1; exit}' sha256sums)"
          test -n "$SHA"
          wget -q "$BASE/$X86_SDK_FILE" -O "$X86_SDK_FILE"
          printf '%s  %s\n' "$SHA" "$X86_SDK_FILE" | sha256sum -c -
          tar --zstd -xf "$X86_SDK_FILE"
          echo "SDK_DIR=$PWD/${X86_SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"
      - name: Prepare and build packages
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update packages
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-manager" package/cowboy-bebop-manager
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-cowboy-bebop" package/luci-app-cowboy-bebop
          make defconfig
          make package/cowboy-bebop-manager/compile package/luci-app-cowboy-bebop/compile V=s
      - uses: actions/upload-artifact@v4
        with:
          name: cowboy-bebop-luci-x86_64
          path: ${{ env.SDK_DIR }}/bin/packages/**/*.apk
          if-no-files-found: warn
  build-kt708:
    needs: test-ui
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'kt708' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd
      - name: Download and verify SDK
        run: |
          set -eu
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${KT708_TARGET}"
          wget -q "$BASE/sha256sums"
          SHA="$(awk -v f="$KT708_SDK_FILE" '$2 == "*" f || $2 == f {print $1; exit}' sha256sums)"
          test "$SHA" = "$KT708_SDK_SHA256"
          wget -q "$BASE/$KT708_SDK_FILE" -O "$KT708_SDK_FILE"
          printf '%s  %s\n' "$SHA" "$KT708_SDK_FILE" | sha256sum -c -
          tar --zstd -xf "$KT708_SDK_FILE"
          echo "SDK_DIR=$PWD/${KT708_SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"
      - name: Prepare and build packages
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update packages
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-manager" package/cowboy-bebop-manager
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-cowboy-bebop" package/luci-app-cowboy-bebop
          make defconfig
          make package/cowboy-bebop-manager/compile package/luci-app-cowboy-bebop/compile V=s
      - uses: actions/upload-artifact@v4
        with:
          name: cowboy-bebop-luci-kt708
          path: ${{ env.SDK_DIR }}/bin/packages/**/*.apk
          if-no-files-found: warn
