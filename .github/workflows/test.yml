name: Tests

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck nftables
      - name: Shell syntax
        run: |
          find core tests openwrt/singbox-manager/files -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n
          sh -n openwrt/luci-app-singbox/root/usr/libexec/rpcd/luci.singbox
      - name: Shellcheck
        run: |
          find core tests openwrt/singbox-manager/files -type f -name '*.sh' -print0 | xargs -0 shellcheck -S error
          shellcheck -S error openwrt/luci-app-singbox/root/usr/libexec/rpcd/luci.singbox
      - name: Test protocol detector
        run: sh ./tests/protocol/test_detector.sh
      - name: Test VMess parser
        run: sh ./tests/vmess/test_parser.sh
      - name: Test VLESS parser
        run: sh ./tests/vless/test_parser.sh
      - name: Test config generator
        run: sh ./tests/config/test_generator.sh
      - name: Test config validator
        run: sh ./tests/config/test_validator.sh
      - name: Test firewall
        run: sh ./tests/network/test_firewall.sh
      - name: Test manager lifecycle contract
        run: sh ./tests/service/test_manager_contract.sh
      - name: Test init recovery contract
        run: sh ./tests/service/test_init_contract.sh
      - name: Test LuCI UI contract
        run: sh ./tests/luci/test_ui_contract.sh
      - name: Check runtime dependencies
        run: |
          grep -F 'uclient-fetch' core/service/manager.sh >/dev/null
          grep -F 'VLESS_ALLOW_INSECURE' core/service/manager.sh >/dev/null
          grep -F 'PENDING_STATE' core/service/manager.sh >/dev/null
          grep -F 'restore_pending_uci' core/service/manager.sh >/dev/null
          ! grep -F 'wget ' core/service/manager.sh >/dev/null
      - name: Check source mirrors
        run: |
          for pair in \
            "core/protocol/detector.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/protocol/detector.sh" \
            "core/protocol/vmess/parser.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/protocol/vmess/parser.sh" \
            "core/protocol/vless/parser.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/protocol/vless/parser.sh" \
            "core/config/generator.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/config/generator.sh" \
            "core/config/validator.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/config/validator.sh" \
            "core/config/version.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/config/version.sh" \
            "core/network/firewall.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/network/firewall.sh" \
            "core/service/manager.sh|openwrt/singbox-manager/files/usr/lib/singbox-manager/service/manager.sh"; do
            core_file=${pair%%|*}
            packaged_file=${pair#*|}
            cmp -s "$core_file" "$packaged_file"
          done
      - name: Check secret logging
        run: |
          if grep -R -nE 'echo .*proxy_url|logger .*proxy_url|echo .*uuid|logger .*uuid' core >/dev/null 2>&1; then
            echo 'possible secret logging found' >&2
            exit 1
          fi
      - name: Test version
        run: sh ./tests/config/test_version.sh
