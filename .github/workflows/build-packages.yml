name: Build OpenWrt packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget

      - name: Download OpenWrt SDK
        run: |
          wget -q https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          echo "SDK_DIR=$PWD/$(tar --zstd -tf openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst | head -1 | cut -d/ -f1)" >> "$GITHUB_ENV"

      - name: Prepare required feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update packages luci
          ./scripts/feeds install -p packages sing-box jq
          ./scripts/feeds install -p luci luci-base
          test -f feeds/luci/luci.mk
          test -f feeds/packages/net/sing-box/Makefile || test -f feeds/packages/*/sing-box/Makefile

      - name: Copy project packages
        run: |
          cp -a "$GITHUB_WORKSPACE/openwrt/singbox-manager" "$SDK_DIR/package/singbox-manager"
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-singbox" "$SDK_DIR/package/luci-app-singbox"

      - name: Build packages
        run: |
          cd "$SDK_DIR"
          make defconfig
          make package/singbox-manager/compile package/luci-app-singbox/compile V=s

      - name: Collect packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$SDK_DIR/bin/packages" -type f -name 'singbox-manager_*.apk' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \\;
          find "$SDK_DIR/bin/packages" -type f -name 'luci-app-singbox_*.apk' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \\;
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-x86-64-packages
          path: artifacts/*.apk
          if-no-files-found: error
