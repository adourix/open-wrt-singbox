name: Build OpenWrt packages

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "openwrt/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "core/**"
      - "openwrt/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Package target"
        required: true
        default: "kt708"
        type: choice
        options:
          - kt708
          - x86_64
          - both
      kt708_sdk_url:
        description: "Optional exact KT-708 SDK tarball URL. Leave empty to use the configured snapshot SDK."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  X86_OPENWRT_VERSION: "25.12.5"
  X86_SDK_FILE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  KT708_OPENWRT_VERSION: "24.10-SNAPSHOT"
  KT708_TARGET: "ipq40xx/generic"
  KT708_ARCH: "arm_cortex-a7_neon-vfpv4"
  KT708_SDK_FILE: openwrt-sdk-24.10-SNAPSHOT-ipq40xx-generic_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst

jobs:
  build-x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd

      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: ${{ env.X86_SDK_FILE }}
          key: sdk-${{ env.X86_SDK_FILE }}

      - name: Download and verify OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${X86_OPENWRT_VERSION}/targets/x86/64"
          wget -q "$BASE/sha256sums"
          [ -f "$X86_SDK_FILE" ] || wget -q "$BASE/$X86_SDK_FILE"
          grep "$X86_SDK_FILE" sha256sums | sha256sum -c -
          tar --zstd -xf "$X86_SDK_FILE"
          echo "SDK_DIR=$PWD/${X86_SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"

      - name: Prepare required feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update packages luci
          test -f feeds/luci/luci.mk
          test -f feeds/packages/net/sing-box/Makefile || test -f feeds/packages/*/sing-box/Makefile

      - name: Copy project packages
        run: |
          cp -a "$GITHUB_WORKSPACE/openwrt/singbox-manager" "$SDK_DIR/package/singbox-manager"
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-singbox" "$SDK_DIR/package/luci-app-singbox"

      - name: Build packages
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd "$SDK_DIR"
          make defconfig
          LOG="$GITHUB_WORKSPACE/build.log"
          if ! make package/singbox-manager/compile package/luci-app-singbox/compile V=s > "$LOG" 2>&1; then
            echo "::group::Context before the first make failure"
            grep -n -m1 -B40 '\*\*\*' "$LOG" || tail -n 80 "$LOG"
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-x86_64
          path: build.log
          if-no-files-found: ignore

      - name: Collect packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$SDK_DIR/bin/packages" -type f \
            \( -name 'singbox-manager-*.apk' -o -name 'luci-app-singbox-*.apk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.X86_OPENWRT_VERSION }}-x86-64-packages
          path: artifacts/*.apk
          if-no-files-found: error

  build-kt708:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'kt708' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd

      - name: Resolve KT-708 SDK
        env:
          INPUT_SDK_URL: ${{ inputs.kt708_sdk_url }}
        run: |
          set -eu
          if [ -n "${INPUT_SDK_URL:-}" ]; then
            SDK_URL="$INPUT_SDK_URL"
            SDK_FILE="$(basename "$SDK_URL")"
          else
            SDK_FILE="$KT708_SDK_FILE"
            SDK_URL="https://downloads.openwrt.org/snapshots/targets/${KT708_TARGET}/$SDK_FILE"
          fi
          echo "SDK_FILE=$SDK_FILE" >> "$GITHUB_ENV"
          echo "SDK_URL=$SDK_URL" >> "$GITHUB_ENV"
          echo "SDK_DIR=$PWD/${SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"

      - name: Download KT-708 SDK
        run: |
          set -eu
          wget -q "$SDK_URL" -O "$SDK_FILE"
          tar --zstd -xf "$SDK_FILE"

      - name: Verify SDK target and architecture
        run: |
          set -eu
          cd "$SDK_DIR"
          grep -q "ipq40xx/generic" .config 2>/dev/null || true
          echo "Expected target: $KT708_TARGET"
          echo "Expected package architecture: $KT708_ARCH"
          echo "SDK directory: $SDK_DIR"
          test -f feeds.conf.default || true

      - name: Prepare required feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update packages luci
          test -f feeds/luci/luci.mk
          test -f feeds/packages/net/sing-box/Makefile || test -f feeds/packages/*/sing-box/Makefile

      - name: Copy project packages
        run: |
          cp -a "$GITHUB_WORKSPACE/openwrt/singbox-manager" "$SDK_DIR/package/singbox-manager"
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-singbox" "$SDK_DIR/package/luci-app-singbox"

      - name: Build KT-708 packages
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd "$SDK_DIR"
          make defconfig
          LOG="$GITHUB_WORKSPACE/build-kt708.log"
          if ! make package/singbox-manager/compile package/luci-app-singbox/compile V=s > "$LOG" 2>&1; then
            echo "::group::Context before the first make failure"
            grep -n -m1 -B40 '\*\*\*' "$LOG" || tail -n 80 "$LOG"
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload KT-708 build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-kt708
          path: build-kt708.log
          if-no-files-found: ignore

      - name: Collect KT-708 packages
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/artifacts-kt708"
          find "$SDK_DIR/bin/packages" -type f \
            \( -name 'singbox-manager-*.ipk' -o -name 'luci-app-singbox-*.ipk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts-kt708/" \;
          test -n "$(find "$GITHUB_WORKSPACE/artifacts-kt708" -type f -name '*.ipk' -print -quit)"
          ls -lh "$GITHUB_WORKSPACE/artifacts-kt708"

      - name: Upload KT-708 packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.KT708_OPENWRT_VERSION }}-ipq40xx-generic-kt708
          path: artifacts-kt708/*.ipk
          if-no-files-found: error
