name: Build OpenWrt packages

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "openwrt/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "core/**"
      - "openwrt/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Package target"
        required: true
        default: "kt708"
        type: choice
        options:
          - kt708
          - x86_64
          - both

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: "25.12.5"
  X86_SDK_FILE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  KT708_OPENWRT_VERSION: "25.12.5"
  KT708_TARGET: "ipq40xx/generic"
  KT708_ARCH: "arm_cortex-a7_neon-vfpv4"
  KT708_SDK_FILE: openwrt-sdk-25.12.5-ipq40xx-generic_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
  KT708_SDK_SHA256: af3d15643f8459335b1c98dc97dd47897d2d8e825a990a161b16b43de2281515

jobs:
  build-x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'x86_64' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd
      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: ${{ env.X86_SDK_FILE }}
          key: sdk-${{ env.X86_SDK_FILE }}
      - name: Download and verify OpenWrt SDK
        run: |
          set -eu
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          wget -q "$BASE/sha256sums"
          EXPECTED_SHA="$(awk -v f="$X86_SDK_FILE" '$2 == "*" f || $2 == f {print $1; exit}' sha256sums)"
          test -n "$EXPECTED_SHA"
          if [ -f "$X86_SDK_FILE" ]; then printf '%s  %s\n' "$EXPECTED_SHA" "$X86_SDK_FILE" | sha256sum -c - || rm -f "$X86_SDK_FILE"; fi
          [ -f "$X86_SDK_FILE" ] || wget -q "$BASE/$X86_SDK_FILE" -O "$X86_SDK_FILE"
          printf '%s  %s\n' "$EXPECTED_SHA" "$X86_SDK_FILE" | sha256sum -c -
          tar --zstd -xf "$X86_SDK_FILE"
          echo "SDK_DIR=$PWD/${X86_SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"
      - name: Prepare required feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update packages
          test -f feeds/packages/net/sing-box/Makefile
      - name: Copy project packages
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-manager" "$SDK_DIR/package/cowboy-bebop-manager"
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-cowboy-bebop" "$SDK_DIR/package/luci-app-cowboy-bebop"
      - name: Configure package metadata
        run: |
          set -eu
          cd "$SDK_DIR"
          make defconfig
          test -f package/cowboy-bebop-manager/Makefile
          test -f package/luci-app-cowboy-bebop/Makefile
          grep -q '^PKG_NAME:=cowboy-bebop-manager$' package/cowboy-bebop-manager/Makefile
          grep -q '^PKG_NAME:=luci-app-cowboy-bebop$' package/luci-app-cowboy-bebop/Makefile
          grep -q 'Package/cowboy-bebop-manager' package/cowboy-bebop-manager/Makefile
          grep -q 'DEPENDS:=+luci-base +rpcd +cowboy-bebop-manager' package/luci-app-cowboy-bebop/Makefile
      - name: Build packages
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -eu
          cd "$SDK_DIR"
          LOG="$GITHUB_WORKSPACE/build.log"
          if ! make package/cowboy-bebop-manager/compile package/luci-app-cowboy-bebop/compile V=s > "$LOG" 2>&1; then
            echo "::group::Context before the first make failure"
            grep -n -m1 -B40 '\*\*\*' "$LOG" || tail -n 100 "$LOG"
            echo "::endgroup::"
            exit 1
          fi
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-x86_64
          path: build.log
          if-no-files-found: ignore
      - name: Collect packages
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$SDK_DIR/bin/packages" -type f \( -name 'cowboy-bebop-manager-*.apk' -o -name 'luci-app-cowboy-bebop-*.apk' \) -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          for name in cowboy-bebop-manager luci-app-cowboy-bebop; do
            if [ -z "$(find "$GITHUB_WORKSPACE/artifacts" -type f -name "${name}-*.apk" -print -quit)" ]; then echo "::error::No ${name}-*.apk was produced"; exit 1; fi
          done
          ls -lh "$GITHUB_WORKSPACE/artifacts"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-x86-64-packages
          path: artifacts/*.apk
          if-no-files-found: error

  build-kt708:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'kt708' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd
      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: ${{ env.KT708_SDK_FILE }}
          key: sdk-${{ env.KT708_SDK_FILE }}
      - name: Download and verify KT-708 SDK (ipq40xx/generic)
        run: |
          set -eu
          BASE="https://downloads.openwrt.org/releases/${KT708_OPENWRT_VERSION}/targets/${KT708_TARGET}"
          wget -q "$BASE/sha256sums"
          OFFICIAL_SHA="$(awk -v f="$KT708_SDK_FILE" '$2 == "*" f || $2 == f {print $1; exit}' sha256sums)"
          test -n "$OFFICIAL_SHA"
          test "$OFFICIAL_SHA" = "$KT708_SDK_SHA256"
          if [ -f "$KT708_SDK_FILE" ]; then printf '%s  %s\n' "$KT708_SDK_SHA256" "$KT708_SDK_FILE" | sha256sum -c - || rm -f "$KT708_SDK_FILE"; fi
          [ -f "$KT708_SDK_FILE" ] || wget -q "$BASE/$KT708_SDK_FILE" -O "$KT708_SDK_FILE"
          printf '%s  %s\n' "$KT708_SDK_SHA256" "$KT708_SDK_FILE" | sha256sum -c -
          tar --zstd -xf "$KT708_SDK_FILE"
          echo "SDK_DIR=$PWD/${KT708_SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"
      - name: Verify SDK target and package architecture
        run: |
          set -eu
          cd "$SDK_DIR"
          make defconfig
          grep -q '^CONFIG_TARGET_ipq40xx=y$' .config
          grep -q "^CONFIG_TARGET_ARCH_PACKAGES=\"${KT708_ARCH}\"$" .config
      - name: Prepare required feeds
        run: |
          set -eu
          cd "$SDK_DIR"
          ./scripts/feeds update packages
          test -f feeds/packages/net/sing-box/Makefile
      - name: Copy project packages
        run: |
          set -eu
          cp -a "$GITHUB_WORKSPACE/openwrt/cowboy-bebop-manager" "$SDK_DIR/package/cowboy-bebop-manager"
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-cowboy-bebop" "$SDK_DIR/package/luci-app-cowboy-bebop"
      - name: Configure package metadata
        run: |
          set -eu
          cd "$SDK_DIR"
          make defconfig
          test -f package/cowboy-bebop-manager/Makefile
          test -f package/luci-app-cowboy-bebop/Makefile
          grep -q '^PKG_NAME:=cowboy-bebop-manager$' package/cowboy-bebop-manager/Makefile
          grep -q '^PKG_NAME:=luci-app-cowboy-bebop$' package/luci-app-cowboy-bebop/Makefile
          grep -q 'Package/cowboy-bebop-manager' package/cowboy-bebop-manager/Makefile
          grep -q 'DEPENDS:=+luci-base +rpcd +cowboy-bebop-manager' package/luci-app-cowboy-bebop/Makefile
      - name: Build KT-708 packages
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -eu
          cd "$SDK_DIR"
          LOG="$GITHUB_WORKSPACE/build-kt708.log"
          if ! make package/cowboy-bebop-manager/compile package/luci-app-cowboy-bebop/compile V=s > "$LOG" 2>&1; then
            echo "::group::Context before the first make failure"
            grep -n -m1 -B40 '\*\*\*' "$LOG" || tail -n 100 "$LOG"
            echo "::endgroup::"
            exit 1
          fi
      - name: Upload KT-708 build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-kt708
          path: build-kt708.log
          if-no-files-found: ignore
      - name: Collect KT-708 packages
        run: |
          set -eu
          OUT="$GITHUB_WORKSPACE/artifacts-kt708"
          mkdir -p "$OUT"
          find "$SDK_DIR/bin/packages" -type f \( -name 'cowboy-bebop-manager-*.apk' -o -name 'luci-app-cowboy-bebop-*.apk' \) -exec cp {} "$OUT/" \;
          for name in cowboy-bebop-manager luci-app-cowboy-bebop; do
            if [ -z "$(find "$OUT" -type f -name "${name}-*.apk" -print -quit)" ]; then echo "::error::No ${name}-*.apk was produced"; exit 1; fi
          done
          ls -lh "$OUT"
      - name: Upload KT-708 packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.KT708_OPENWRT_VERSION }}-ipq40xx-generic-${{ env.KT708_ARCH }}-packages
          path: artifacts-kt708/*.apk
          if-no-files-found: error
