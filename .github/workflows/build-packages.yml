name: Build OpenWrt packages

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "openwrt/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "core/**"
      - "openwrt/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: "25.12.5"
  SDK_FILE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 rsync unzip \
            zlib1g-dev file wget zstd

      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_FILE }}
          key: sdk-${{ env.SDK_FILE }}

      - name: Download and verify OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64"
          wget -q "$BASE/sha256sums"
          [ -f "$SDK_FILE" ] || wget -q "$BASE/$SDK_FILE"
          grep "$SDK_FILE" sha256sums | sha256sum -c -
          tar --zstd -xf "$SDK_FILE"
          echo "SDK_DIR=$PWD/${SDK_FILE%.tar.zst}" >> "$GITHUB_ENV"

      - name: Prepare required feeds
        run: |
          cd "$SDK_DIR"
          # Update only. Do NOT `feeds install` luci-base / sing-box / jq:
          # installing them makes the SDK try to build them (and their
          # dependencies) from source, which fails (lucihttp) or is very slow
          # (sing-box). They stay runtime dependencies in the generated apk.
          ./scripts/feeds update packages luci
          test -f feeds/luci/luci.mk
          test -f feeds/packages/net/sing-box/Makefile || test -f feeds/packages/*/sing-box/Makefile

      - name: Copy project packages
        run: |
          cp -a "$GITHUB_WORKSPACE/openwrt/singbox-manager" "$SDK_DIR/package/singbox-manager"
          cp -a "$GITHUB_WORKSPACE/openwrt/luci-app-singbox" "$SDK_DIR/package/luci-app-singbox"

      - name: Build packages
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd "$SDK_DIR"
          make defconfig
          LOG="$GITHUB_WORKSPACE/build.log"
          if ! make package/singbox-manager/compile package/luci-app-singbox/compile V=s > "$LOG" 2>&1; then
            echo "::group::Context before the first make failure"
            grep -n -m1 -B40 '\*\*\*' "$LOG" || tail -n 80 "$LOG"
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Collect packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$SDK_DIR/bin/packages" -type f \
            \( -name 'singbox-manager-*.apk' -o -name 'luci-app-singbox-*.apk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-x86-64-packages
          path: artifacts/*.apk
          if-no-files-found: error
